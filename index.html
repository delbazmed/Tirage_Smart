<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1220" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tirage_Smart">
<title>Tirage_Smart</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* ---- Readex Pro (bundled, works offline) ---- */
@font-face{font-family:'Readex Pro';font-weight:400;font-display:swap;src:url(fonts/readex-pro-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'Readex Pro';font-weight:500;font-display:swap;src:url(fonts/readex-pro-arabic-500-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'Readex Pro';font-weight:700;font-display:swap;src:url(fonts/readex-pro-arabic-700-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'Readex Pro';font-weight:400;font-display:swap;src:url(fonts/readex-pro-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:'Readex Pro';font-weight:500;font-display:swap;src:url(fonts/readex-pro-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}
@font-face{font-family:'Readex Pro';font-weight:700;font-display:swap;src:url(fonts/readex-pro-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212}

:root{--r:18px;--grad:linear-gradient(135deg,#14b8a6,#22c55e);--m:#38bdf8;--f:#f472b6;--ok:#22c55e;--no:#f43f5e;--ex:#f59e0b;--font:'Readex Pro',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
html[data-theme=dark]{color-scheme:dark;--bg:#0b1220;--card:#131c2e;--card2:#1a2740;--line:#27364f;--text:#eaf0fa;--muted:#8fa0bd;--acc:#22c55e;--shadow:0 6px 22px #0006}
html[data-theme=light]{color-scheme:light;--bg:#eef2f9;--card:#ffffff;--card2:#f1f5fb;--line:#dbe3f0;--text:#0f1b33;--muted:#5b6b86;--acc:#16a34a;--shadow:0 6px 20px #1b2b4a14}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overscroll-behavior:none}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:38px;height:38px;border-radius:11px;box-shadow:var(--shadow)}
.brand div{display:flex;flex-direction:column;line-height:1.2}
.brand b{font-size:18px;font-weight:700}
.brand small{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:11px;font-weight:700;letter-spacing:.5px}
.hbtns{display:flex;gap:8px;align-items:center}
.ibtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);display:grid;place-items:center;cursor:pointer;padding:0}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.lang{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:0 14px;height:38px;font:500 13px var(--font);cursor:pointer}
main{flex:1;overflow-y:auto;padding:14px 14px 104px;-webkit-overflow-scrolling:touch}
.view{display:none;max-width:560px;margin:0 auto}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:13.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:8px}
.card h3::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--grad)}
textarea,input[type=text],select{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:400 15px var(--font);outline:none}
textarea{min-height:84px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px #22c55e22}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}.row>.fix{flex:none}
button{font-family:inherit}
.btn{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:500 14px var(--font);cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);border-color:transparent;color:#04281a;font-weight:700}
.btn.dng{color:var(--no)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.stat{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:10px;flex-wrap:wrap}
.stat b{color:var(--acc)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.tile{border-radius:14px;padding:8px 2px;text-align:center;background:color-mix(in srgb,var(--tc) 16%,var(--card2));border:1px solid color-mix(in srgb,var(--tc) 40%,transparent)}
.tile b{display:block;font-size:19px;font-weight:700;color:var(--tc);line-height:1.2}
.tile span{font-size:10.5px;color:var(--muted)}
.seg{display:flex;background:var(--card2);border-radius:13px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{flex:1;background:none;border:0;color:var(--muted);padding:8px 4px;border-radius:10px;font:500 12.5px var(--font);cursor:pointer}
.seg button.on{background:var(--grad);color:#04281a;font-weight:700}
.lbl{font-size:13px;color:var(--muted);margin:12px 0 6px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:42px;height:42px;border-radius:13px;background:var(--card2);border:1px solid var(--line);color:var(--text);font-size:21px;cursor:pointer}
.stepper output{min-width:42px;text-align:center;font-weight:700;font-size:21px;color:var(--acc)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px;gap:10px}
.sw input{width:46px;height:26px;accent-color:#22c55e;flex:none}
.go{width:100%;padding:16px;font-size:18px;font-weight:700;border-radius:18px;margin-top:4px;box-shadow:0 8px 24px #22c55e44}
.go:disabled{opacity:.45}
/* people rows */
.curname{display:flex;align-items:center;justify-content:space-between;gap:8px}
.curname b{font-size:17px;font-weight:700;word-break:break-word}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:8px;border-radius:15px;background:color-mix(in srgb,var(--c) 11%,var(--card2));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);border-inline-start:5px solid var(--c)}
.prow.s-a{opacity:.62}.prow.s-a .pname{text-decoration:line-through}
.av{width:38px;height:38px;border-radius:13px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none;text-shadow:0 1px 2px #0003}
.pname{flex:1;font-size:15px;font-weight:500;cursor:pointer;word-break:break-word}
.pname small{color:var(--muted);margin-inline-start:6px;font-size:11px}
.pname small.dr{color:var(--acc)}
.gbtn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:17px;cursor:pointer;flex:none;color:var(--muted);padding:0}
.gbtn.g-m{color:var(--m);border-color:var(--m)}.gbtn.g-f{color:var(--f);border-color:var(--f)}
.st{min-width:58px;height:34px;border-radius:11px;border:1.5px solid;font:700 12px var(--font);cursor:pointer;flex:none;padding:0 8px}
.st-p{background:var(--ok);border-color:var(--ok);color:#04281a}
.st-a{background:transparent;border-color:var(--no);color:var(--no)}
.st-e{background:var(--ex);border-color:var(--ex);color:#3a2300}
.empty{color:var(--muted);text-align:center;padding:20px 0;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 12px;font-size:14px;cursor:pointer;user-select:none}
[dir=rtl] .chip{padding:6px 12px 6px 6px}
.chip.cur{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card2))}
.chip i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.chip small{color:var(--muted)}
/* stage / results */
#stage{display:none;text-align:center;padding:20px 10px;background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--acc) 10%,var(--card)))}
#stage.on{display:block}
.slot{font-size:30px;font-weight:700;min-height:52px;word-break:break-word}
.slot.fin,.winner{color:var(--acc)}
.winner{font-size:34px;font-weight:700;word-break:break-word}
.count{font-size:96px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.wheelwrap{position:relative;width:300px;margin:6px auto;max-width:100%}
.wheelwrap canvas{display:block;border-radius:50%;box-shadow:0 0 0 5px var(--line),0 10px 34px #0006}
.ptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid var(--text);z-index:2;filter:drop-shadow(0 2px 3px #0008)}
#partial{margin-top:10px;color:var(--muted);font-size:14px}
.items{display:flex;flex-direction:column;gap:8px}
.it{background:color-mix(in srgb,var(--c) 13%,var(--card2));border:1px solid color-mix(in srgb,var(--c) 32%,transparent);border-inline-start:5px solid var(--c);border-radius:13px;padding:9px 12px;font-size:15px;font-weight:500;display:flex;gap:10px;animation:pop .35s ease-out both}
.it em{font-style:normal;color:var(--c);font-weight:700;min-width:22px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.gcard{border-radius:16px;padding:0 12px 8px;background:var(--card2);border:1px solid color-mix(in srgb,var(--gc) 40%,transparent);overflow:hidden;animation:pop .4s ease-out both}
.gcard h4{margin:0 -12px 6px;padding:9px 12px;background:var(--gc);color:#fff;font-size:15px;text-shadow:0 1px 2px #0003}
.gcard h4 small{opacity:.85;font-weight:400}
.gcard div{font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.gcard div:last-child{border:0}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.acts .btn{flex:1;white-space:nowrap;padding-inline:8px}
.hitem{border-bottom:1px solid var(--line);padding:10px 0}
.hitem:last-child{border:0}
.hh{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:6px}
.hbody{font-size:14px;white-space:pre-line}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:5;box-shadow:0 -6px 22px #0003}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:6px 2px;font:500 11px var(--font);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:12px}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;z-index:80;max-width:90%;text-align:center}
footer{text-align:center;color:var(--muted);font-size:11px;padding:8px 0 4px}
/* settings */
.dev{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,#14b8a6 22%,var(--card2)),color-mix(in srgb,#38bdf8 16%,var(--card2)));border:1px solid var(--line);margin-bottom:10px}
.dev img{width:58px;height:58px;border-radius:16px;box-shadow:var(--shadow)}
.dev b{font-size:17px;display:block}.dev span{font-size:12.5px;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}.kv span:last-child{font-weight:500;text-align:end}
.fld{margin-bottom:8px}.fld label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
/* modal */
#modal{display:none;position:fixed;inset:0;background:#000a;z-index:50;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--card);border-radius:22px 22px 0 0;border:1px solid var(--line);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h3{margin:0 0 10px;font-size:16px;font-weight:700}
.implist{max-height:46vh;overflow-y:auto;margin:6px 0;border:1px solid var(--line);border-radius:14px;padding:4px 8px}
.irow{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--line)}
.irow:last-child{border:0}
.irow.off{opacity:.35}
.irow input{padding:7px 8px;font-size:14px;min-width:0}
.ick{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:none;color:#04281a;font-weight:700;flex:none;cursor:pointer;padding:0}
.irow:not(.off) .ick{background:var(--ok);border-color:var(--ok)}
.ihead{display:flex;gap:6px;font-size:11px;color:var(--muted);padding:4px 8px 0}
.ihead span{flex:1}.ihead span.sp{flex:none;width:72px}
/* big display */
#big{display:none;position:fixed;inset:0;background:var(--bg);z-index:70;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 24px;text-align:center}
#big.on{display:block}
.bclose{position:fixed;top:calc(env(safe-area-inset-top) + 10px);inset-inline-end:12px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:26px;cursor:pointer;z-index:2}
.btitle{color:var(--muted);font-size:18px;margin:6px 0 18px}
.bone{font-size:clamp(40px,12vw,110px);font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:14vh;word-break:break-word;line-height:1.3}
.blist{display:flex;flex-direction:column;gap:10px;max-width:760px;margin:0 auto;text-align:start}
.blist div{background:color-mix(in srgb,var(--c) 14%,var(--card2));border-inline-start:8px solid var(--c);border-radius:16px;padding:10px 18px;font-size:clamp(24px,6.5vw,52px);font-weight:700;display:flex;gap:16px}
.blist em{font-style:normal;color:var(--c);min-width:1.4em}
.bgroups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;text-align:start}
.bg{background:var(--card2);border:2px solid var(--gc);border-radius:18px;overflow:hidden;padding:0 18px 10px}
.bg h4{margin:0 -18px 8px;padding:10px 18px;background:var(--gc);color:#fff;font-size:clamp(22px,5vw,36px)}
.bg div{font-size:clamp(20px,4.6vw,32px);padding:4px 0;border-bottom:1px dashed var(--line)}
.bg div:last-child{border:0}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="icons/icon-192.png" alt=""><div><b id="appName"></b><small>Delbaz _EPS</small></div></div>
  <div class="hbtns">
    <button class="ibtn" id="themeBtn" data-a="themetoggle" aria-label="theme"></button>
    <button class="lang" id="langBtn"></button>
  </div>
</header>

<main>
  <!-- LIST -->
  <section class="view" id="v-list">
    <div class="card">
      <div class="stat"><span data-t="curList"></span></div>
      <div class="curname"><b id="curName"></b><span><button class="btn sm" data-a="rename" id="renBtn" data-t="rename"></button> <button class="btn sm" data-a="newlist" data-t="newList"></button></span></div>
    </div>
    <div class="card">
      <h3 data-t="addNames"></h3>
      <textarea id="ta" data-ph="addPh"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn pri" data-a="add" data-t="add"></button>
        <button class="btn" data-a="paste" data-t="paste"></button>
        <button class="btn" data-a="import" data-t="importFile"></button>
        <input type="file" id="file" accept=".xlsx,.xls,.xlsm,.ods,.csv,.txt,.docx,.pdf,image/*" hidden>
      </div>
      <div class="hint" data-t="importHint"></div>
    </div>
    <div class="card">
      <div class="tiles" id="tiles"></div>
      <div class="stat"><span></span><span><button class="btn sm" data-a="allpresent" data-t="allPresent"></button> <button class="btn sm dng" data-a="clear" data-t="clearAll"></button></span></div>
      <div id="rows"></div>
      <div class="empty" id="noPeople" data-t="noPeople"></div>
      <div class="hint" id="tapHint" data-t="tapHint"></div>
    </div>
    <div class="card">
      <h3 data-t="savedLists"></h3>
      <div class="row">
        <input type="text" id="listName" data-ph="listPh">
        <button class="btn pri fix" data-a="savelist" data-t="saveAs"></button>
      </div>
      <div id="saved" style="margin-top:10px" class="chips"></div>
    </div>
  </section>

  <!-- DRAW -->
  <section class="view" id="v-draw">
    <div class="card">
      <div class="stat"><span id="drawStat"></span><span id="drawnStat"></span></div>
      <div class="seg" id="gfSeg" style="margin-bottom:10px"></div>
      <div class="seg" id="modeSeg"></div>
      <div id="opts"></div>
    </div>
    <div class="card" id="stage"><div id="eff"></div><div id="partial"></div></div>
    <button class="btn pri go" id="go" data-a="go"></button>
    <div class="card" id="result" style="display:none;margin-top:12px"></div>
  </section>

  <!-- HISTORY -->
  <section class="view" id="v-hist">
    <div class="card">
      <div class="stat"><span data-t="tabHist"></span><button class="btn sm dng" data-a="clearhist" data-t="clearAll"></button></div>
      <div id="hist"></div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section class="view" id="v-set">
    <div class="card">
      <h3 data-t="setAppearance"></h3>
      <div class="seg" id="themeSeg"></div>
    </div>
    <div class="card">
      <h3 data-t="setSound"></h3>
      <div class="sw"><span data-t="sound"></span><input type="checkbox" data-chk="sound" id="cSound"></div>
      <div class="sw"><span data-t="vibe"></span><input type="checkbox" data-chk="vibe" id="cVibe"></div>
      <div class="sw"><span data-t="speakL"></span><input type="checkbox" data-chk="speak" id="cSpeak"></div>
      <div class="lbl" data-t="rateL"></div>
      <div class="seg" id="rateSeg"></div>
      <div class="row" style="margin-top:10px"><button class="btn" data-a="speaktest" data-t="speakTest"></button></div>
      <div class="hint" id="speakHint"></div>
    </div>
    <div class="card">
      <h3 data-t="setHdr"></h3>
      <div class="fld"><label data-t="hdrTeacher"></label><input type="text" data-hdr="teacher"></div>
      <div class="fld"><label data-t="hdrSchool"></label><input type="text" data-hdr="school"></div>
      <div class="fld"><label data-t="hdrSeason"></label><input type="text" data-hdr="season" placeholder="2026/2027"></div>
      <div class="fld"><label data-t="hdrSup"></label><input type="text" data-hdr="supervisor"></div>
      <div class="fld"><label data-t="hdrDir"></label><input type="text" data-hdr="director"></div>

const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ًͯ-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').toLowerCase().trim();

const HLN=new Set(['اللقب','لقب','nom','famille','surname','lastname']);
const HFN=new Set(['الاسم','اسم','prenom','firstname','given']);
const HFULL=new Set(['الكامل','complet','full','fullname']);
const HG=new Set(['الجنس','جنس','sexe','genre','sex','gender']);
const HX=new Set(['رقم','الرقم','n','no','num','numero','تاريخ','الميلاد','الازدياد','date','naissance','ملاحظات','ملاحظه','observation','observations','القسم','classe','النقطه','نقطه','العلامه','التلاميذ','التلميذ','قايمه','الاسماء','liste','eleves','eleve','nom','prenom','et','و']);
const HSKIP=new Set(['ثانويه','متوسطه','اكماليه','ابتدايه','مديريه','وزاره','الجمهوريه','lycee','college','cem','ecole','annee','الموسم','السنه','الدراسيه','الفوج','المجموع','total','قايمه','تلاميذ','التلاميذ','اساتذه','الاساتذه','liste','page','صفحه','اسميه']);
const GM=new Set(['ذكر','ذ','ذكور','m','male','masculin','garcon','g','h','homme','masc']);
const GF=new Set(['انثي','ا','اناث','f','female','feminin','fille','femme','fem']);
const isSkipLine=s=>String(s).split(/[\s\-–—:|]+/).some(w=>w&&HSKIP.has(norm(w)));
function hdrTokens(c){return norm(c).replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(Boolean).map(w=>w==='ولقب'?'لقب':(w.startsWith('وال')?w.slice(1):w))}
function classifyHeader(c){
  c=String(c||'').trim();if(!c||c.length>32)return null;
  const tk=hdrTokens(c);if(!tk.length)return null;
  if(tk.some(w=>HG.has(w)))return{k:'g'};
  const ln=tk.some(w=>HLN.has(w)),fn=tk.some(w=>HFN.has(w)),full=tk.some(w=>HFULL.has(w))||tk.join('')==='name';
  if((ln&&fn)||full)return{k:'full'};
  if(ln)return{k:'ln'};if(fn)return{k:'fn'};return null}
const gOf=c=>{const n=norm(c);return GM.has(n)?'m':GF.has(n)?'f':''};
const isGender=c=>{const n=norm(c);return GM.has(n)||GF.has(n)};
function cleanText(s){return String(s==null?'':s).replace(/^\s*[\d٠-٩]+\s*[-.)؛:،]+\s*/,'').replace(/[|;؛\t]+/g,' ').replace(/\s+/g,' ').replace(/^[^\p{L}]+|[^\p{L}]+$/gu,'').trim()}
function parseLine(text){
  if(isSkipLine(text))return null;
  let s=String(text).replace(/\d{1,4}[\/\-.]\d{1,2}[\/\-.]\d{2,4}/g,' ').replace(/[|;؛\t]+/g,' ').replace(/^\s*[\d٠-٩]+\s*[-.)؛:،]*\s*/,'').replace(/[\d٠-٩]+/g,' ');
  const raw=s.split(/\s+/).map(w=>w.replace(/^[^\p{L}]+|[^\p{L}]+$/gu,'')).filter(Boolean);
  let g='';const tk=[];
  raw.forEach((w,i)=>{const n=norm(w),edge=i===0||i===raw.length-1;
    if(raw.length>1&&(n.length>2||edge)&&(GM.has(n)||GF.has(n)))g=g||(GM.has(n)?'m':'f');else tk.push(w)});
  if(!tk.length||tk.join('').length<2)return null;
  if(tk.every(w=>{const n=norm(w);return HLN.has(n)||HFN.has(n)||HG.has(n)||HX.has(n)||HFULL.has(n)}))return null;
  return{n:tk.join(' '),g}}
function findHeader(rows){
  for(let i=0;i<Math.min(8,rows.length);i++){
    const cols=(rows[i]||[]).map(classifyHeader);
    if(cols.some(c=>c&&c.k!=='g'))return{i,cols}}
  return null}
/* a name = the full name as written in the file (last name + first name in file order) */
function parseRows(rows){
  const out=[],H=findHeader(rows);let start=0,map=null;
  if(H){start=H.i+1;map={};H.cols.forEach((c,j)=>{if(c&&!(c.k in map))map[c.k]=j})}
  for(let i=start;i<rows.length;i++){
    const r=(rows[i]||[]).map(x=>String(x==null?'':x).trim());
    if(!r.some(Boolean))continue;
    if(map){
      if(r.some(c=>{const k=classifyHeader(c);return k&&k.k!=='g'}))continue;
      const parts=[];
      if(map.ln!==undefined&&map.fn!==undefined){parts.push(cleanText(r[map.ln]),cleanText(r[map.fn]))}
      else if(map.full!==undefined)parts.push(cleanText(r[map.full]));
      else if(map.ln!==undefined)parts.push(cleanText(r[map.ln]));
      else if(map.fn!==undefined)parts.push(cleanText(r[map.fn]));
      const n=parts.filter(Boolean).join(' ');
      if(!hasLetter(n))continue;
      out.push({n,g:map.g!==undefined?gOf(r[map.g]):''});
    }else{
      let g='';const tc=[];const cells=r.filter(Boolean);
      for(const c of cells){
        if(isGender(c)&&cells.length>1){g=g||gOf(c);continue}
        if(isDate(c)||!hasLetter(c))continue;tc.push(c)}
      if(!tc.length)continue;
      if(tc.length===1){const e=parseLine(tc[0]);if(e){if(!e.g)e.g=g;out.push(e)}continue}
      if(tc.every(c=>classifyHeader(c))||tc.some(isSkipLine))continue;
      const a=cleanText(tc[0]),b=cleanText(tc[1]);
      if(!hasLetter(a)||!hasLetter(b))continue;
      out.push({n:a+' '+b,g});
    }
  }
  return out}

function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/).slice(0,5).join('\n');
  const sep=[';',',','\t'].map(c=>[c,(first.split(c).length-1)]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows}

async function slotEffect(names,idx){
  const steps=22;

    eff().innerHTML=`<div class="slot ${fin?'fin pop':''}">${esc(fin?names[idx]:names[randInt(names.length)])}</div>`;

function wheelEffect(names,idx){
  if(names.length>40)return slotEffect(names,idx);
  return new Promise(res=>{
    const n=names.length,size=300,dpr=window.devicePixelRatio||1,seg=2*Math.PI/n;
    eff().innerHTML='<div class="wheelwrap"><div class="ptr"></div><canvas id="wc"></canvas></div>';
    const c=$('#wc');c.width=c.height=size*dpr;c.style.width=c.style.height=size+'px';
    const g=c.getContext('2d');g.scale(dpr,dpr);
    const fs=n<=8?16:n<=16?13:n<=28?10:8;
    const draw=r=>{g.clearRect(0,0,size,size);g.save();g.translate(size/2,size/2);
      for(let i=0;i<n;i++){const a=r+i*seg;g.beginPath();g.moveTo(0,0);g.arc(0,0,size/2-4,a,a+seg);g.closePath();
        g.fillStyle=PALD[i%PALD.length];if(n%PALD.length===1&&i===n-1)g.fillStyle='#64748b';g.fill();g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2;g.stroke();
        g.save();g.rotate(a+seg/2);g.textAlign='right';g.textBaseline='middle';g.fillStyle='#fff';g.font=`700 ${fs}px ${FONTQ}`;
        const nm=names[i].length>13?names[i].slice(0,12)+'…':names[i];g.fillText(nm,size/2-14,0);g.restore()}
      g.beginPath();g.arc(0,0,17,0,7);g.fillStyle='#0b1220';g.fill();g.strokeStyle='#fff';g.lineWidth=3;g.stroke();g.restore()};
    const final=-Math.PI/2-(idx+.5)*seg,target=final+2*Math.PI*(5+randInt(3)),dur=3800;
    let last=-1;const t0=performance.now();
    (function frame(now){const p=Math.min(1,(now-t0)/dur),r=target*(1-Math.pow(1-p,3));draw(r);
      const k=Math.floor((((-Math.PI/2-r)/seg)%n+n)%n);if(k!==last){last=k;beep(500,.025,.05,'triangle')}
      if(p<1)requestAnimationFrame(frame);else res()})(t0)})}
async function countEffect(names,idx){

function makeGroups(pool,ng,bG,bL){
  const lv=p=>p.lv||2;let order=shuffle(pool);
  if(bL)order.sort((a,b)=>lv(b)-lv(a));
  else if(bG){const cnt={m:0,f:0,'':0};pool.forEach(p=>cnt[p.g||'']++);order.sort((a,b)=>cnt[a.g||'']-cnt[b.g||''])}
  const G=Array.from({length:ng},()=>({m:[],cnt:{m:0,f:0,'':0},sum:0}));
  for(const p of order){
    const minSize=Math.min(...G.map(x=>x.m.length)),cand=G.filter(x=>x.m.length===minSize);
    let best=[],bs=Infinity;
    for(const x of cand){const s=(bG?x.cnt[p.g||'']*1000:0)+(bL?x.sum:0);if(s<bs){bs=s;best=[x]}else if(s===bs)best.push(x)}
    const x=best[randInt(best.length)];x.m.push(p);x.cnt[p.g||'']++;x.sum+=lv(p)}
  return G.map(x=>x.m)}

async function runDraw(){
  if(busy)return;

  let pool=S.mode==='groups'?groupsPool():basePool();
  if(S.mode==='winner'&&S.noRepeat)pool=pool.filter(p=>!S.drawn.includes(p.id));
  if(!pool.length)return toast(t('noneLeft'));
  if((S.mode==='groups'||S.mode==='order')&&pool.length<2)return toast(t('needTwo'));
  let roles=[];
  if(S.mode==='roles'){S.roles=($('#rolesTa')?$('#rolesTa').value:S.roles);save();roles=S.roles.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(!roles.length)return toast(t('rolesNeed'))}

  const stage=$('#stage');stage.classList.add('on');$('#partial').textContent='';stage.scrollIntoView({behavior:'smooth',block:'center'});
  const spin=async(list,n,d)=>{eff().innerHTML='';for(let s=0;s<n;s++){eff().innerHTML=`<div class="slot">${esc(dn(list[randInt(list.length)]))}</div>`;beep(300+s*30,.04,.04,'square');await sleep(d)}};
  let entry=null,speakNow=false;

      entry=finish('winner',t('resWinner'),[{h:'',num:true,items:won.map(dn)}]);
    }else if(S.mode==='order'){
      await spin(pool,14,70);
      entry=finish('order',t('resOrder'),[{h:'',num:true,items:shuffle(pool).map(dn)}]);speakNow=true;
    }else if(S.mode==='roles'){
      if(roles.length>pool.length)toast(t('rolesFew'));
      const k=Math.min(roles.length,pool.length),sh=shuffle(pool).slice(0,k);
      await spin(pool,14,70);
      entry=finish('roles',t('resRoles'),[{h:'',num:false,items:roles.slice(0,k).map((r,i)=>`${r}: ${dn(sh[i])}`)}]);speakNow=true;
    }else{

    }
  }finally{busy=false;stage.classList.remove('on');renderAll()}
  if(speakNow&&entry)speakAll(speechLines(entry));
}

    case'es':EDIT.s=v;$$('[data-a=es]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));break;
    case'el':EDIT.lv=Number(v);$$('[data-a=el]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));break;
    case'esave':{const p=S.people.find(x=>x.id===EDIT.id);if(p){const n=$('#eN').value.trim();if(n)p.n=n;p.g=EDIT.g;p.s=EDIT.s;p.lv=EDIT.lv;save()}closeModal();renderAll();break}
    case'edel':{S.people=S.people.filter(x=>x.id!==EDIT.id);S.drawn=S.drawn.filter(x=>x!==EDIT.id);save();closeModal();renderAll();break}
    case'close':closeModal();break;
    case'add':{const ta=$('#ta'),ents=parseRows(ta.value.split(/\r?\n/).map(l=>[l]));if(ents.length){const r=addEntries(ents,false);ta.value='';toast(`${r.added} ${t('added')}${r.dup?` · ${r.dup} ${t('impDup')}`:''}`)}break}
    case'paste':{try{const txt=await navigator.clipboard.readText();startPreview(t('clipboard'),{sheets:[{name:'',rows:txt.split(/\r?\n/).map(l=>[l])}]})}catch(err){toast(t('pasteFail'))}break}
    case'import':$('#file').click();break;
    case'allpresent':S.people.forEach(p=>p.s='');save();renderAll();break;
    case'clear':if(S.people.length&&confirm(t('delConfirm'))){S.people=[];S.drawn=[];save();renderAll()}break;
    case'newlist':{if(S.people.length&&!S.curList&&!confirm(t('discardConfirm')))break;save();S.curList='';S.people=[];S.drawn=[];save();renderAll();break}
    case'rename':{const n=(prompt(t('renamePrompt'),S.curList)||'').trim();if(!n||n===S.curList)break;if(S.lists[n]){toast(t('exists'));break}save();S.lists[n]=S.lists[S.curList];delete S.lists[S.curList];S.curList=n;save();renderAll();break}
    case'savelist':{const n=$('#listName').value.trim();if(!n||!S.people.length)break;
      if(S.lists[n]&&n!==S.curList&&!confirm(n+' — '+t('exists')+'. OK?'))break;
      S.curList=n;save();$('#listName').value='';renderAll();toast(t('saved'));break}
    case'openlist':if(v!==S.curList)openList(v);break;
    case'rmlist':{delete S.lists[v];if(S.curList===v)S.curList='';save();renderAll();break}
    case'resetdrawn':S.drawn=[];save();renderAll();break;
    case'go':runDraw();break;
    case'clearhist':if(S.history.length&&confirm(t('delConfirm'))){S.history=[];save();renderHist()}break;
    case'hcopy':{const h=S.history[v];copyText(blocksText(h.title,h.blocks));break}
    case'hdel':S.history.splice(v,1);save();renderHist();break;
    case'speakres':{stopSpeech();unlockSpeech();const was=S.speak;S.speak=true;await speakAll(speechLines(window.LAST));S.speak=was;break}
    case'copyres':copyText(blocksText(window.LAST.title,window.LAST.blocks));break;
    case'shareres':{const txt=blocksText(window.LAST.title,window.LAST.blocks);if(navigator.share){try{await navigator.share({text:txt})}catch(err){}}else copyText(txt);break}
    case'pdfres':exportPDF();break;
    case'bigres':showBig();break;
    case'closebig':closeBig();break;
    case'imptoggle':{const x=IMP.ents[v];x.on=!x.on;const row=T.closest('.irow');row.classList.toggle('off',!x.on);T.textContent=x.on?'✓':'';impCount();break}
    case'impg':{const x=IMP.ents[v];x.g=x.g===''?'m':x.g==='m'?'f':'';T.className='gbtn g-'+(x.g||'n');T.textContent=GS[x.g||''];break}
    case'impadd':finishImport(false);break;
    case'impreplace':finishImport(true);break;
  }
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.chk;if(k){S[k]=e.target.checked;save();if(k==='speak'&&!S.speak)stopSpeech();renderAll();return}
  if(e.target.id==='impSheet'&&IMP){IMP.si=Number(e.target.value);reparse();renderImp()}
});
document.addEventListener('input',e=>{
  const d=e.target.dataset;
  if(d&&d.ei!==undefined&&IMP){IMP.ents[d.ei].n=e.target.value;return}
  if(d&&d.hdr){S.hdr[d.hdr]=e.target.value;save();return}
  if(e.target.id==='rolesTa'){S.roles=e.target.value;save()}
});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)importFile(f)});
$('#langBtn').addEventListener('click',()=>{S.lang=S.lang==='ar'?'fr':'ar';save();renderAll()});
if(speechOK()&&speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',()=>renderSettings());

renderAll();
try{['400','700'].forEach(w=>{document.fonts.load(`${w} 16px "Readex Pro"`,'قرعة');document.fonts.load(`${w} 16px "Readex Pro"`,'Tirage')})}catch(e){}
(function shareTarget(){
  const q=new URLSearchParams(location.search),txt=[q.get('title'),q.get('text')].filter(Boolean).join('\n');
  if(txt){history.replaceState(null,'',location.pathname);startPreview(t('clipboard'),{sheets:[{name:'',rows:txt.split(/\r?\n/).map(l=>[l])}]})}
})();
if(S.seenVer!==APP.ver){const first=FRESH;S.seenVer=APP.ver;save();if(!first)setTimeout(showWhatsNew,600)}
function updBanner(){if($('#upd'))return;const d=document.createElement('div');d.id='upd';d.className='toast';d.style.cssText+=';display:flex;gap:10px;align-items:center;pointer-events:auto;bottom:100px';d.innerHTML=`<span>${esc(t('updReady'))}</span><button class="btn sm pri" id="updBtn">${esc(t('updNow'))}</button>`;document.body.appendChild(d);$('#updBtn').onclick=()=>location.reload()}
if('serviceWorker' in navigator){
  const hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtl)updBanner()});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{r.update().catch(()=>{});setInterval(()=>r.update().catch(()=>{}),3600000)}).catch(()=>{}));
}
</script>
</body>
